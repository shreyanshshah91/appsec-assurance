# Continuous security review (Mode 5) for GitLab CI. Include from .gitlab-ci.yml.
appsec:
  stage: test
  image: python:3.12-slim
  variables:
    APPSEC_REF: v1.0.1
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - git clone --depth 1 --branch "$APPSEC_REF" https://github.com/shreyanshshah91/appsec-assurance.git /opt/appsec
  script:
    # On merge requests, use config + baseline from the target branch so an MR can't loosen its own gate.
    - mkdir -p .appsec-trusted
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch --depth=1 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:.appsec/config.json" > .appsec-trusted/config.json 2>/dev/null || echo '{}' > .appsec-trusted/config.json
        git show "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:.appsec/baseline.json" > .appsec-trusted/baseline.json 2>/dev/null || true
      else
        cp .appsec/config.json .appsec-trusted/ 2>/dev/null || echo '{}' > .appsec-trusted/config.json
        cp .appsec/baseline.json .appsec-trusted/ 2>/dev/null || true
      fi
    - python3 /opt/appsec/skills/appsec-assurance/scripts/appsec.py ci --config .appsec-trusted/config.json --baseline .appsec-trusted/baseline.json --fail-on high --out .appsec/out --mode continuous
  artifacts:
    when: always
    paths: [.appsec/out/]
    reports:
      sast: .appsec/out/report.sarif
